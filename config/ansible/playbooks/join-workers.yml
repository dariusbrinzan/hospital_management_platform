---
- name: Create a fresh join command on the first control plane
  hosts: kube_control_plane[0]
  become: true
  tasks:
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Persist join command as host fact
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_command_raw.stdout }} --v=5"

- name: Join worker nodes to the cluster
  hosts: kube_workers
  become: true
  roles:
    - role: worker
      vars:
        kubeadm_join_command: "{{ hostvars[groups['kube_control_plane'][0]].kubeadm_join_command }}"

