---
- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >
    kubeadm init
    --kubernetes-version v{{ kubernetes_version }}
    --control-plane-endpoint {{ control_plane_endpoint }}
    --pod-network-cidr {{ pod_network_cidr }}
    --service-cidr {{ service_cidr }}
  when: not admin_conf.stat.exists

- name: Ensure kube config directory exists for the remote user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy admin kubeconfig to remote user home
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Install CNI plugin manifest
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f {{ cni_manifest_url }}
  register: cni_apply
  changed_when: "'created' in cni_apply.stdout or 'configured' in cni_apply.stdout"

- name: Generate join command for later use
  ansible.builtin.command: kubeadm token create --print-join-command
  register: control_plane_join_command
  changed_when: false

- name: Save join command as host fact
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ control_plane_join_command.stdout }} --v=5"

