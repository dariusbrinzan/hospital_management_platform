apiVersion: apps/v1
kind: Deployment
metadata:
  name: carepulse
  labels:
    app.kubernetes.io/name: carepulse
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: carepulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carepulse
    spec:
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/example/carepulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: carepulse-config
            - secretRef:
                name: carepulse-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

