apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-carepulse
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: carepulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: carepulse
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - {}
