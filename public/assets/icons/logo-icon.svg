<svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel elements (left side) -->
  <g opacity="0.6">
    <rect x="2" y="6" width="2" height="2" fill="url(#pixelGradient)"/>
    <rect x="4" y="4" width="1.5" height="1.5" fill="url(#pixelGradient)"/>
    <rect x="1" y="10" width="1.5" height="1.5" fill="url(#pixelGradient)"/>
    <rect x="5" y="8" width="1" height="1" fill="url(#pixelGradient)"/>
  </g>
  
  <!-- Medical Cross with gradient -->
  <g transform="translate(10, 7)">
    <!-- Cross shape -->
    <rect x="6" y="0" width="4" height="12" rx="1" fill="url(#crossGradient)"/>
    <rect x="0" y="6" width="16" height="4" rx="1" fill="url(#crossGradient)"/>
    
    <!-- ECG/Heartbeat line (white) -->
    <path d="M 2 8 L 3 7 L 4 9 L 5 5 L 6 10 L 7 6 L 8 9 L 9 7 L 10 8 L 11 6 L 12 10 L 13 7 L 14 9" 
          stroke="white" 
          stroke-width="1.5" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <!-- Cross gradient (blue to green) -->
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pixel gradient (blue to green) -->
    <linearGradient id="pixelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
