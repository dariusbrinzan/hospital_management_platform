<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel elements (left side) -->
  <g opacity="0.8">
    <rect x="0" y="8" width="4" height="4" fill="url(#pixelGradient)"/>
    <rect x="6" y="6" width="3" height="3" fill="url(#pixelGradient)"/>
    <rect x="2" y="14" width="3" height="3" fill="url(#pixelGradient)"/>
    <rect x="8" y="12" width="2" height="2" fill="url(#pixelGradient)"/>
    <rect x="4" y="20" width="2" height="2" fill="url(#pixelGradient)"/>
  </g>
  
  <!-- Medical Cross with gradient -->
  <g transform="translate(20, 5)">
    <!-- Cross shape -->
    <rect x="12" y="0" width="8" height="24" rx="2" fill="url(#crossGradient)"/>
    <rect x="0" y="12" width="32" height="8" rx="2" fill="url(#crossGradient)"/>
    
    <!-- ECG/Heartbeat line (white) -->
    <path d="M 4 16 L 6 14 L 8 18 L 10 10 L 12 20 L 14 12 L 16 18 L 18 14 L 20 16 L 22 12 L 24 20 L 26 14 L 28 18" 
          stroke="white" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Text "eHealth.ro" -->
  <text x="60" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0D9488">eHealth</text>
  <text x="140" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#14B8A6">.ro</text>
  
  <!-- Gradients -->
  <defs>
    <!-- Cross gradient (blue to green) -->
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pixel gradient (blue to green) -->
    <linearGradient id="pixelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
